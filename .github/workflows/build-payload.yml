name: build-payload
# openjdk feedstock: fetch → stage → image → smoke → (on tags) publish.
# One mechanical leg per (version × platform) in the recipe's sources —
# aarch64-macos + x86_64-windows-ucrt today.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.platform.triplet }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - triplet: aarch64-macos
            asset_platform: macos-arm64
            os: macos-14
            exe_suffix: ""
            tar: tar
            tfs_asset: tfs-0.1.5-macos-arm64
            tfs_sha256: 1bf5646ef48dd63f27678f5b680cde6832f651a3a24c1f2ab467e7d706af4eeb
          - triplet: x86_64-windows-ucrt
            asset_platform: windows-ucrt64
            os: windows-latest
            exe_suffix: .exe
            # bsdtar (ucrt64 libarchive) reads the windows zip; GNU tar cannot.
            tar: /d/a/_temp/msys64/ucrt64/bin/bsdtar.exe
            tfs_asset: tfs-0.1.5-windows-ucrt64.exe
            tfs_sha256: b1165ca8266ec4b589be81d48e2d20ed125f2de75cd75674e50bd384ede59ec8
          - triplet: x86_64-linux-gnu
            asset_platform: linux-gnu-x86_64
            os: ubuntu-24.04
            exe_suffix: ""
            tar: tar
            tfs_asset: tfs-0.1.5-linux-gnu-x86_64
            tfs_sha256: da5178b480609b18f16de01b2e11cfd948a9fea1e7c4bdb02448e8543472d252
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bsdtar is the only msys2 need: the recipe's windows source is a
      # zip and GNU tar cannot read it (the macOS leg uses system tar).
      # gcc-libs rides along for any ucrt64 toolchain binary that still
      # wants the gcc-runtime DLLs; the v0.1.5 tebako binaries themselves
      # are statically linked (the release's ship gate audits PE imports).
      - name: Set up MSys2 (ucrt64 bsdtar + gcc runtime)
        if: matrix.platform.triplet == 'x86_64-windows-ucrt'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          install: mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-gcc-libs

      # The imager (tfs mkimage/extract) is the product repo's own
      # published binary — releases are the interface; the feedstock
      # never builds the tebako stack from source. The hash is pinned in
      # the matrix (cross-checked against the release's SHA256SUMS) like
      # the recipe pins the Temurin archive's.
      - name: Fetch the imager (tebako release v0.1.5, sha256-pinned)
        shell: bash
        env:
          TRIPLET: ${{ matrix.platform.triplet }}
          TFS_ASSET: ${{ matrix.platform.tfs_asset }}
          TFS_SHA256: ${{ matrix.platform.tfs_sha256 }}
          TFS_BIN: .packager/tfs${{ matrix.platform.exe_suffix }}
        run: |
          set -euo pipefail
          mkdir -p .packager
          curl -sL --fail -o "$TFS_BIN" \
            "https://github.com/tamatebako/tebako/releases/download/v0.1.5/$TFS_ASSET"
          echo "$TFS_SHA256  $TFS_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          chmod +x "$TFS_BIN"
          # The v0.1.5 windows binary dynamically imports the ucrt64
          # gcc-runtime DLLs (libstdc++-6, libwinpthread-1) — off the
          # default PATH the loader kills it with a silent exit 127.
          # Resolve them from the msys2 install (the payload step's
          # closed PATH does the same for mkimage/extract).
          if [ "$TRIPLET" = "x86_64-windows-ucrt" ]; then
            export PATH="/d/a/_temp/msys64/ucrt64/bin:$PATH"
          fi
          # Bare invocation prints the help and exits 0 (tfs has no
          # --version flag): the dead-binary smoke, here where the
          # download just happened, not inside the payload step.
          "$TFS_BIN" > /dev/null

      - name: Build the payload
        shell: bash
        env:
          TRIPLET: ${{ matrix.platform.triplet }}
          ASSET_PLATFORM: ${{ matrix.platform.asset_platform }}
          EXE_SUFFIX: ${{ matrix.platform.exe_suffix }}
          TAR: ${{ matrix.platform.tar }}
          TFS_CLI: .packager/tfs${{ matrix.platform.exe_suffix }}
        # The windows leg runs a closed PATH: the runner's default PATH
        # carries several stray mingw installs, and keeping them out of
        # DLL/tool resolution removes a whole silent-failure class.
        run: |
          if [ "${{ matrix.platform.triplet }}" = "x86_64-windows-ucrt" ]; then
            export PATH="/d/a/_temp/msys64/ucrt64/bin:/c/Program Files/Git/usr/bin:/c/Program Files/Git/cmd:/c/Windows/System32"
          fi
          tools/build

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.platform.triplet }}
          path: out/${{ matrix.platform.triplet }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/.packager/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect payloads (all legs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The publisher is the product repo's published CLI (same release
      # line as the imager), sha256-pinned — never a from-source build.
      # tebako publish also needs the dispatcher (it refuses to register
      # shims pointing at nothing, exit 74) — fetch both, both pinned.
      - name: Fetch the publisher (tebako release v0.1.5, sha256-pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          curl -sL --fail -o .packager/tebako \
            https://github.com/tamatebako/tebako/releases/download/v0.1.5/tebako-0.1.5-macos-arm64
          curl -sL --fail -o .packager/tebako-shim \
            https://github.com/tamatebako/tebako/releases/download/v0.1.5/tebako-shim-0.1.5-macos-arm64
          echo "f8c679655d6a34163c5af2be2e80c162d4aca449e088042e29e86f9f22d3b67c  .packager/tebako" \
            | shasum -a 256 -c -
          echo "fdf5470255733e381b950dedacdb5b01531b559d4808c08ee145b48627ac477d  .packager/tebako-shim" \
            | shasum -a 256 -c -
          chmod +x .packager/tebako .packager/tebako-shim
          .packager/tebako --help > /dev/null
      - name: Publish (release + registry + clean-cache verify)
        shell: bash
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" publish --name openjdk \
            --release "tfs:github:tebako-packages/openjdk:${{ github.ref_name }}" \
            --payload "aarch64-macos=out/aarch64-macos/openjdk-${{ github.ref_name }}-macos-arm64.tfs" \
            --payload "x86_64-windows-ucrt=out/x86_64-windows-ucrt/openjdk-${{ github.ref_name }}-windows-ucrt64.tfs" \
            --payload "x86_64-linux-gnu=out/x86_64-linux-gnu/openjdk-${{ github.ref_name }}-linux-gnu-x86_64.tfs" \
            --registry-out "$GITHUB_WORKSPACE/tpkg-registry.yaml"
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry"
          # force-with-lease on the bot branch: a re-publish re-creates it
          # (the first attempt's branch rejected the second's push, 21.0.12)
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
