name: build-payload
# openjdk feedstock: fetch → stage → image → smoke → (on tags) publish.
# One mechanical leg per (version × platform) in the recipe's sources —
# aarch64-macos + x86_64-windows-ucrt + x86_64-linux-gnu.
#
# PIN DISCIPLINE (the owner's rule): this workflow carries NO version or
# digest literals. recipe.yml is the SSOT — the `tools:` block pins the
# tebako/tfs CLIs (release + per-platform sha256); tools/pins.rb reads it
# into $GITHUB_ENV and the fetch steps cross-check the pins against the
# release's own SHA256SUMS (both anchored, provenance verified).
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.platform.triplet }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        # Identity only (which leg, which runner, which archiver). All
        # versions/digests flow from recipe.yml via tools/pins.rb.
        platform:
          - triplet: aarch64-macos
            asset_platform: macos-arm64
            os: macos-14
            exe_suffix: ""
            tar: tar
          - triplet: x86_64-windows-ucrt
            asset_platform: windows-ucrt64
            os: windows-latest
            exe_suffix: .exe
            # bsdtar (ucrt64 libarchive) reads the windows zip; GNU tar cannot.
            tar: /d/a/_temp/msys64/ucrt64/bin/bsdtar.exe
          - triplet: x86_64-linux-gnu
            asset_platform: linux-gnu-x86_64
            os: ubuntu-24.04
            exe_suffix: ""
            tar: tar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bsdtar is the only msys2 need: the recipe's windows source is a
      # zip and GNU tar cannot read it (the macOS leg uses system tar).
      # gcc-libs rides along for any ucrt64 toolchain binary that still
      # wants the gcc-runtime DLLs; the pinned tebako binaries themselves
      # are statically linked (the release's ship gate audits PE imports).
      - name: Set up MSys2 (ucrt64 bsdtar + gcc runtime)
        if: matrix.platform.triplet == 'x86_64-windows-ucrt'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          install: mingw-w64-ucrt-x86_64-libarchive mingw-w64-ucrt-x86_64-gcc-libs

      # recipe.yml's tools block is the toolchain pin SSOT; pins.rb emits
      # TEBAKO_RELEASE/VERSION, PKG_NAME/PKG_VERSION and the per-platform
      # TFS_ASSET/TFS_SHA256 for THIS leg's asset_platform. (windows: the
      # runner's hosted Ruby serves Git-bash steps.)
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        shell: bash
        run: ruby tools/pins.rb "${{ matrix.platform.asset_platform }}" --env >> "$GITHUB_ENV"

      # The imager (tfs mkimage/extract) is the product repo's own
      # published binary — releases are the interface; the feedstock
      # never builds the tebako stack from source. The pin flows from
      # recipe.yml and is cross-checked against the release's SHA256SUMS,
      # like the recipe pins the Temurin archive's.
      - name: Fetch the imager (pinned by recipe.yml, sha256-verified)
        shell: bash
        env:
          TFS_BIN: .packager/tfs${{ matrix.platform.exe_suffix }}
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o "$TFS_BIN" "$base/$TFS_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TFS_SHA256  $TFS_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          # The pin must agree with the release's own sums (both anchored).
          got=$(awk -v a="$TFS_ASSET" '$2 == a {print $1}' SHA256SUMS)
          [ "$got" = "$TFS_SHA256" ] || { echo "::error::pin mismatch for $TFS_ASSET: recipe.yml=$TFS_SHA256 release=${got:-ABSENT}"; exit 1; }
          chmod +x "$TFS_BIN"
          # Bare invocation prints the help and exits 0 (tfs has no
          # --version flag): the dead-binary smoke, here where the
          # download just happened, not inside the payload step.
          "$TFS_BIN" > /dev/null

      - name: Build the payload
        shell: bash
        env:
          TRIPLET: ${{ matrix.platform.triplet }}
          ASSET_PLATFORM: ${{ matrix.platform.asset_platform }}
          EXE_SUFFIX: ${{ matrix.platform.exe_suffix }}
          TAR: ${{ matrix.platform.tar }}
          TFS_CLI: .packager/tfs${{ matrix.platform.exe_suffix }}
        # The windows leg runs a closed PATH: the runner's default PATH
        # carries several stray mingw installs, and keeping them out of
        # DLL/tool resolution removes a whole silent-failure class.
        run: |
          if [ "${{ matrix.platform.triplet }}" = "x86_64-windows-ucrt" ]; then
            export PATH="/d/a/_temp/msys64/ucrt64/bin:/c/Program Files/Git/usr/bin:/c/Program Files/Git/cmd:/c/Windows/System32"
          fi
          tools/build

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.platform.triplet }}
          path: out/${{ matrix.platform.triplet }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/.packager/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect payloads (all legs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The publisher is the product repo's published CLI (same release
      # line as the imager), pinned by recipe.yml's tools block — never a
      # from-source build, no literals in this workflow. tebako publish
      # also needs the dispatcher (it refuses to register shims pointing
      # at nothing, exit 74) — fetch both, both pinned, both cross-checked
      # against the release's SHA256SUMS.
      - name: Read the toolchain pins (recipe.yml is the SSOT)
        run: ruby tools/pins.rb macos-arm64 --env >> "$GITHUB_ENV"
      - name: Fetch the publisher (pinned by recipe.yml, sha256-verified)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          base="https://github.com/tamatebako/tebako/releases/download/$TEBAKO_RELEASE"
          curl -sL --fail -o .packager/tebako "$base/$TEBAKO_ASSET"
          curl -sL --fail -o .packager/tebako-shim "$base/$SHIM_ASSET"
          curl -sL --fail -o SHA256SUMS "$base/SHA256SUMS"
          echo "$TEBAKO_SHA256  .packager/tebako" | shasum -a 256 -c -
          echo "$SHIM_SHA256  .packager/tebako-shim" | shasum -a 256 -c -
          for pair in "$TEBAKO_ASSET:$TEBAKO_SHA256" "$SHIM_ASSET:$SHIM_SHA256"; do
            asset="${pair%%:*}"; want="${pair##*:}"
            got=$(awk -v a="$asset" '$2 == a {print $1}' SHA256SUMS)
            [ "$got" = "$want" ] || { echo "::error::pin mismatch for $asset: recipe.yml=$want release=${got:-ABSENT}"; exit 1; }
          done
          chmod +x .packager/tebako .packager/tebako-shim
          .packager/tebako --help > /dev/null
      # The payload filenames come from tools/build's own naming
      # (<name>-<upstream.version>-<asset_platform>.tfs — recipe values,
      # NOT the git tag: a tag may carry a feedstock revision suffix like
      # 21.0.12-2 while the artifact keeps the upstream version).
      - name: Publish (release + registry + clean-cache verify)
        shell: bash
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" publish --name "$PKG_NAME" \
            --release "tfs:github:tebako-packages/openjdk:${{ github.ref_name }}" \
            --payload "aarch64-macos=out/aarch64-macos/$PKG_NAME-$PKG_VERSION-macos-arm64.tfs" \
            --payload "x86_64-windows-ucrt=out/x86_64-windows-ucrt/$PKG_NAME-$PKG_VERSION-windows-ucrt64.tfs" \
            --payload "x86_64-linux-gnu=out/x86_64-linux-gnu/$PKG_NAME-$PKG_VERSION-linux-gnu-x86_64.tfs" \
            --registry-out "$GITHUB_WORKSPACE/tpkg-registry.yaml"
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-ci"
          git config user.email "tebako@ribose.com"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry"
          # force-with-lease on the bot branch: a re-publish re-creates it
          # (the first attempt's branch rejected the second's push, 21.0.12)
          git push --force-with-lease origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch" || gh pr merge --squash "$branch"
