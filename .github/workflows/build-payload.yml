name: build-payload
# openjdk feedstock: fetch → stage → image → smoke → (on tags) publish.
# One mechanical leg per (version × platform) in the recipe's sources —
# aarch64-macos + x86_64-windows-ucrt today.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write

jobs:
  build:
    name: ${{ matrix.platform.triplet }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - triplet: aarch64-macos
            asset_platform: macos-arm64
            os: macos-14
            exe_suffix: ""
            tar: tar
            tfs_asset: tfs-0.1.1-macos-arm64
            tfs_sha256: b1848bda4d12ec520faa682adf293f58e07ba6fedc28e373911cff24e56fe412
          - triplet: x86_64-windows-ucrt
            asset_platform: windows-ucrt64
            os: windows-latest
            exe_suffix: .exe
            # bsdtar (ucrt64 libarchive) reads the windows zip; GNU tar cannot.
            tar: /d/a/_temp/msys64/ucrt64/bin/bsdtar.exe
            tfs_asset: tfs-0.1.1-windows-ucrt64.exe
            tfs_sha256: 82ed22135321449c81530e1fabeba73555195ea411e0d9cca4458a23fe5ad01c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # bsdtar: the recipe's windows source is a zip and GNU tar cannot
      # read it (the macOS leg uses system tar). gcc-libs is explicit:
      # the v0.1.1 windows tfs binary imports the ucrt64 gcc-runtime DLLs
      # (libstdc++-6, libwinpthread-1) and both the fetch-step smoke and
      # the payload step resolve them from here. ucrt64 ruby: the build's
      # read-back step parses the embedded manifest as YAML (the macOS
      # leg uses the system ruby).
      - name: Set up MSys2 (ucrt64 bsdtar + gcc runtime + ruby)
        if: matrix.platform.triplet == 'x86_64-windows-ucrt'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          install: >-
            mingw-w64-ucrt-x86_64-libarchive
            mingw-w64-ucrt-x86_64-gcc-libs
            mingw-w64-ucrt-x86_64-ruby

      # The imager (tfs mkimage/extract) is the product repo's own
      # published binary — releases are the interface; the feedstock
      # never builds the tebako stack from source. v0.1.1 ships no
      # SHA256SUMS asset yet, so the hash is pinned in the matrix like
      # the recipe pins the Temurin archive's.
      - name: Fetch the imager (tebako release v0.1.1, sha256-pinned)
        shell: bash
        env:
          TRIPLET: ${{ matrix.platform.triplet }}
          TFS_ASSET: ${{ matrix.platform.tfs_asset }}
          TFS_SHA256: ${{ matrix.platform.tfs_sha256 }}
          TFS_BIN: .packager/tfs${{ matrix.platform.exe_suffix }}
        run: |
          set -euo pipefail
          mkdir -p .packager
          curl -sL --fail -o "$TFS_BIN" \
            "https://github.com/tamatebako/tebako/releases/download/v0.1.1/$TFS_ASSET"
          echo "$TFS_SHA256  $TFS_BIN" | { sha256sum -c - 2>/dev/null || shasum -a 256 -c -; }
          chmod +x "$TFS_BIN"
          # The v0.1.1 windows binary dynamically imports the ucrt64
          # gcc-runtime DLLs (libstdc++-6, libwinpthread-1) — off the
          # default PATH the loader kills it with a silent exit 127.
          # Resolve them from the msys2 install (the payload step's
          # closed PATH does the same for mkimage/extract).
          if [ "$TRIPLET" = "x86_64-windows-ucrt" ]; then
            export PATH="/d/a/_temp/msys64/ucrt64/bin:$PATH"
          fi
          # Bare invocation prints the help and exits 0 (tfs has no
          # --version flag): the dead-binary smoke, here where the
          # download just happened, not inside the payload step.
          "$TFS_BIN" > /dev/null

      - name: Build the payload
        shell: bash
        env:
          TRIPLET: ${{ matrix.platform.triplet }}
          ASSET_PLATFORM: ${{ matrix.platform.asset_platform }}
          EXE_SUFFIX: ${{ matrix.platform.exe_suffix }}
          TAR: ${{ matrix.platform.tar }}
          TFS_CLI: .packager/tfs${{ matrix.platform.exe_suffix }}
        # The windows leg runs a closed PATH: the runner's default PATH
        # carries several stray mingw installs, and keeping them out of
        # DLL/tool resolution removes a whole silent-failure class.
        run: |
          if [ "${{ matrix.platform.triplet }}" = "x86_64-windows-ucrt" ]; then
            export PATH="/d/a/_temp/msys64/ucrt64/bin:/c/Program Files/Git/usr/bin:/c/Program Files/Git/cmd:/c/Windows/System32"
          fi
          tools/build

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.platform.triplet }}
          path: out/${{ matrix.platform.triplet }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/.packager/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Collect payloads (all legs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      # The publisher is the product repo's published CLI (same release
      # line as the imager), sha256-pinned — never a from-source build.
      - name: Fetch the publisher (tebako release v0.1.1, sha256-pinned)
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p .packager
          curl -sL --fail -o .packager/tebako \
            https://github.com/tamatebako/tebako/releases/download/v0.1.1/tebako-0.1.1-macos-arm64
          echo "025fdf6948ab678895004349c7ada9c4a13676de5d1eb71bdac40dedcae73d84  .packager/tebako" \
            | shasum -a 256 -c -
          chmod +x .packager/tebako
          .packager/tebako --help > /dev/null
      - name: Publish (release + registry + clean-cache verify)
        shell: bash
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" publish --name openjdk \
            --release "tfs:github:tebako-packages/openjdk:${{ github.ref_name }}" \
            --payload "aarch64-macos=out/aarch64-macos/openjdk-${{ github.ref_name }}-macos-arm64.tfs" \
            --payload "x86_64-windows-ucrt=out/x86_64-windows-ucrt/openjdk-${{ github.ref_name }}-windows-ucrt64.tfs" \
            --registry-out "$GITHUB_WORKSPACE/tpkg-registry.yaml"
      # main is branch-protected (and the GitHub-Actions bypass is not
      # available on this plan): the registry lands by bot PR + auto-merge,
      # never by direct push. Idempotent across re-runs of the same tag.
      - name: Publish the registry entry via pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "tebako-packages[bot]"
          git config user.email "bot@tebako.org"
          git fetch origin main
          if git diff --quiet origin/main -- tpkg-registry.yaml; then
            echo "registry unchanged (or the entry already landed on main)"
            exit 0
          fi
          branch="publish/${{ github.ref_name }}-registry"
          git checkout -b "$branch"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry (macos-arm64, windows-ucrt64)"
          git push origin "$branch"
          if ! gh pr view "$branch" >/dev/null 2>&1; then
            gh pr create --base main --head "$branch" \
              --title "publish ${{ github.ref_name }}: registry entry" \
              --body "Automated registry entry for ${{ github.ref_name }} (the build-payload publish job; main is protected, so the registry lands by PR)."
          fi
          gh pr merge --auto --squash "$branch"
