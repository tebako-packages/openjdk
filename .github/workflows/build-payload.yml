name: build-payload
# openjdk feedstock: fetch → stage → image → smoke → (on tags) publish.
# One mechanical leg per (version × platform) in the recipe's sources —
# aarch64-macos + x86_64-windows-ucrt today.
on:
  push:
    branches: [main]
    tags: ["*"]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: ${{ matrix.platform.triplet }}
    runs-on: ${{ matrix.platform.os }}
    strategy:
      fail-fast: false
      matrix:
        platform:
          - triplet: aarch64-macos
            asset_platform: macos-arm64
            os: macos-14
            vcpkg_triplet: arm64-osx-static
            target_dir: target/release
            exe_suffix: ""
            tar: tar
          - triplet: x86_64-windows-ucrt
            asset_platform: windows-ucrt64
            os: windows-latest
            vcpkg_triplet: x64-mingw-static
            target_dir: target/x86_64-pc-windows-gnu/release
            exe_suffix: .exe
            # bsdtar (ucrt64 libarchive) reads the windows zip; GNU tar cannot.
            tar: /d/a/_temp/msys64/ucrt64/bin/bsdtar.exe
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The imager + publisher come from the product repo's own release
      # channel — until the CLI binaries ship as release artifacts, the
      # leg builds them from source (pinned ref).
      - name: Checkout tebako (the imager + publisher)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako
          path: tebako

      - name: Checkout dwarfs-rs (path dep of the product workspace)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive

      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root and exports
        # DWARFS_RS_VCPKG_INSTALLED_DIR into GITHUB_ENV.
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t ${{ matrix.platform.vcpkg_triplet }} \
            || echo "baseline miss — ports build normally"

      # The windows CLI build uses the proven ucrt64 shape (tebako-rs's
      # ci/windows-gnu-cli.sh): one toolchain, a closed PATH, the make
      # toolshim + BOTAN_CONFIGURE_CC + BINDGEN_EXTRA_CLANG_ARGS for the
      # vendored rnp/Botan, and the trailing -lmsvcrt RUSTFLAGS.
      - name: Set up MSys2 (ucrt64 toolchain + cmake/ninja + bsdtar)
        if: matrix.platform.triplet == 'x86_64-windows-ucrt'
        uses: msys2/setup-msys2@66cd2cce69caa17b53920067426061ca1de3a884 # v2
        with:
          msystem: ucrt64
          path-type: minimal
          install: mingw-w64-ucrt-x86_64-toolchain mingw-w64-ucrt-x86_64-cmake mingw-w64-ucrt-x86_64-ninja mingw-w64-ucrt-x86_64-make mingw-w64-ucrt-x86_64-libarchive

      - name: Cache the cargo target dir
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            tebako

      - name: Install toolchain (rustup)
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable

      - name: Set up vcpkg
        uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: f14401ca0f2754347c3864da7488a9b955b4e47a
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root

      - name: Build the tfs + tebako CLIs (POSIX legs)
        if: matrix.platform.triplet != 'x86_64-windows-ucrt'
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          SQFS_SYS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --release --manifest-path tebako/Cargo.toml -p tfs-cli -p tebako-cli

      - name: Build the tfs + tebako CLIs (windows-gnu)
        if: matrix.platform.triplet == 'x86_64-windows-ucrt'
        shell: bash
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: |
          set -euo pipefail
          export PATH="/d/a/_temp/msys64/ucrt64/bin:/c/Program Files/Git/usr/bin:/c/Program Files/Git/cmd:/c/Users/runneradmin/.cargo/bin:/c/Windows/System32"
          TOOLSHIM=/d/a/_temp/tebako-toolshim
          mkdir -p "$TOOLSHIM"
          cp "/d/a/_temp/msys64/ucrt64/bin/mingw32-make.exe" "$TOOLSHIM/make.exe"
          export PATH="$TOOLSHIM:$PATH"
          export CARGO_TARGET_X86_64_PC_WINDOWS_GNU_LINKER=gcc.exe
          export RUSTFLAGS="-C link-arg=-static-libgcc -C link-arg=-static-libstdc++ -C link-arg=-lmsvcrt"
          export BOTAN_CONFIGURE_CC=gcc
          UCRT64=/d/a/_temp/msys64/ucrt64
          GCC_INCLUDE=$(echo "$UCRT64"/lib/gcc/x86_64-w64-mingw32/*/include)
          [ -d "$GCC_INCLUDE" ] || { echo "ucrt64 gcc include dir missing"; exit 1; }
          # WINDOWS-FORM paths (D:/...) — the runner's libclang is a native
          # Windows binary; the msys form (/d/a/...) does not resolve.
          export BINDGEN_EXTRA_CLANG_ARGS="--target=x86_64-w64-mingw32 -isystem $(cygpath -m "$UCRT64/include") -isystem $(cygpath -m "$GCC_INCLUDE")"
          cargo build --release --manifest-path tebako/Cargo.toml \
            --target x86_64-pc-windows-gnu -p tfs-cli -p tebako-cli
          # Forensics before the payload step: a windows binary that fails
          # to START (DLL class) exits 127 with no stderr — enumerate the
          # imports up front and smoke the CLI here, where the build env
          # is still live, instead of debugging the payload step blind.
          # (Bare invocation prints the help and exits 0 — tfs has no
          # --version flag.)
          for exe in tebako/target/x86_64-pc-windows-gnu/release/tfs.exe \
                     tebako/target/x86_64-pc-windows-gnu/release/tebako.exe; do
            echo "=== imports: $exe ==="
            objdump -p "$exe" | grep -E "DLL Name" | sort -u || true
          done
          tebako/target/x86_64-pc-windows-gnu/release/tfs.exe
          # The mkimage subcommand is the release-build failure surface
          # (exit 127 at `tfs mkimage` in the payload step, run 30730024429,
          # while the bare invocation works). Run it HERE (same env as the
          # build) with the NT status in hex and the CRT-private import
          # table — an entry point the release optimizer emits but the
          # runner's UCRT lacks is the prime suspect (debug builds pass).
          TFS=tebako/target/x86_64-pc-windows-gnu/release/tfs.exe
          echo "=== crt-private imports: tfs.exe ==="
          objdump -p "$TFS" | sed -n '/api-ms-win-crt-private/,/^\s*$/p' | head -40 || true
          mkdir -p /d/a/_temp/mkimage-probe/root/__tpkg__
          echo "name: probe" > /d/a/_temp/mkimage-probe/root/__tpkg__/manifest.yaml
          "$TFS" mkimage --format dwarfs /d/a/_temp/mkimage-probe/root --output /d/a/_temp/mkimage-probe/probe.tfs
          rc=$?
          printf 'mkimage probe exit: %d (0x%x)\n' "$rc" "$rc"
          exit "$rc"

      - name: Build the payload
        shell: bash
        env:
          TRIPLET: ${{ matrix.platform.triplet }}
          ASSET_PLATFORM: ${{ matrix.platform.asset_platform }}
          EXE_SUFFIX: ${{ matrix.platform.exe_suffix }}
          TAR: ${{ matrix.platform.tar }}
          TFS_CLI: tebako/${{ matrix.platform.target_dir }}/tfs${{ matrix.platform.exe_suffix }}
        run: tools/build

      - name: Upload payload
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: payload-${{ matrix.platform.triplet }}
          path: out/${{ matrix.platform.triplet }}/
          retention-days: 7

  release:
    name: publish
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: macos-14
    env:
      TEBAKO_CLI: ${{ github.workspace }}/tebako/target/release/tebako
      TEBAKO_HOME: ${{ github.workspace }}/.tebako
      TEBAKO_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/tebako
          path: tebako
      - name: Checkout dwarfs-rs (path dep)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: tamatebako/dwarfs-rs
          path: dwarfs-rs
          submodules: recursive
      - name: Restore the vcpkg baseline (dwarfs-t is the single writer)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Never fails the leg: a miss means the ports build normally.
        # The script owns the canonical root and exports
        # DWARFS_RS_VCPKG_INSTALLED_DIR into GITHUB_ENV.
        run: |
          bash dwarfs-rs/dwarfs-t/ci/vcpkg-baseline-restore.sh \
            dwarfs-rs/dwarfs-t arm64-osx-static \
            || echo "baseline miss — ports build normally"
      - name: Cache the cargo target dir
        uses: Swatinem/rust-cache@c19371144df3bb44fab255c43d04cbc2ab54d1c4 # v2.9.1
        with:
          workspaces: |
            tebako
      - name: Collect payloads (all legs)
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: payload-*
          path: out/
          merge-multiple: false
      - name: Restore layout
        shell: bash
        run: |
          set -e
          for d in out/payload-*/; do
            p="${d#out/payload-}"; p="${p%/}"
            mkdir -p "out/$p"
            mv "$d"* "out/$p/"
            rmdir "$d"
          done
      - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4 # stable
      - uses: lukka/run-vcpkg@b1a0dd252f06b9e25b3c022a9a03bd7a427fb6a2 # v11.6
        with:
          vcpkgGitCommitId: f14401ca0f2754347c3864da7488a9b955b4e47a
          vcpkgDirectory: ${{ github.workspace }}/.vcpkg-root
      - name: Build the tebako CLI
        env:
          DWARFS_RS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          SQFS_SYS_VCPKG_ROOT: ${{ github.workspace }}/.vcpkg-root
          CARGO_NET_GIT_FETCH_WITH_CLI: "true"
        run: cargo build --release --manifest-path tebako/Cargo.toml -p tebako-cli
      - name: Publish (release + registry + clean-cache verify)
        shell: bash
        run: |
          set -euo pipefail
          "$TEBAKO_CLI" publish --name openjdk \
            --release "tfs:github:tebako-packages/openjdk:${{ github.ref_name }}" \
            --payload "aarch64-macos=out/aarch64-macos/openjdk-${{ github.ref_name }}-macos-arm64.tfs" \
            --payload "x86_64-windows-ucrt=out/x86_64-windows-ucrt/openjdk-${{ github.ref_name }}-windows-ucrt64.tfs" \
            --registry-out tpkg-registry.yaml
      - name: Commit the registry
        run: |
          set -euo pipefail
          git config user.name "tebako-packages[bot]"
          git config user.email "bot@tebako.org"
          git add tpkg-registry.yaml
          git commit -m "publish ${{ github.ref_name }}: registry entry (macos-arm64, windows-ucrt64)" || echo "registry unchanged"
          git push
