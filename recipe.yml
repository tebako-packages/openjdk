# Feedstock recipe for openjdk
# spec 13 §9 + docs/conventions.md in tebako-packages/index
name: "openjdk"
kind: toolkit
summary: "OpenJDK (Temurin JRE) — the hermetic java for metanorma's jing/mn2pdf chain"

upstream:
  # Eclipse Temurin JRE 21.0.12+8 (Adoptium) — one binary source per
  # platform (repack: no compilation). platform is the spec 03 triplet;
  # strip_components is the nesting depth of the payload root inside the
  # archive (macOS nests under <tag>/Contents/Home, windows under one dir).
  version: "21.0.12"
  build: "8"            # the Temurin build number (21.0.12+8)
  sources:
    - platform: "aarch64-macos"
      url: "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jre_aarch64_mac_hotspot_21.0.12_8.tar.gz"
      sha256: "36bb71d6fa5184e12a6483e7662783c2cbd383f5dca8034140f0a84dd5aa797d"
      strip_components: 3
    - platform: "x86_64-windows-ucrt"
      url: "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jre_x64_windows_hotspot_21.0.12_8.zip"
      sha256: "b8aa18fef5edb69bee8618f99677d66d0873d22cb40d974c15ac9ffcdecf73ba"
      strip_components: 1
    - platform: "x86_64-linux-gnu"
      url: "https://github.com/adoptium/temurin21-binaries/releases/download/jdk-21.0.12%2B8/OpenJDK21U-jre_x64_linux_hotspot_21.0.12_8.tar.gz"
      sha256: "8a379a67c91a3ae61ffb33d46e0a40c7ba35e70713c4db31cfca30492f792eff"
      strip_components: 1

build:
  system: repack          # no compilation: unpack, prune, image
  deps: []

# Factory tools used by tools/build (the imager) and the publish job (the
# packager + dispatcher): the tebako/tfs CLIs from the tamatebako/tebako
# release. The asset digests are pinned HERE — tools.sha256 is the repo's
# toolchain pin SSOT (the workflow carries no version or digest literals;
# tools/pins.rb reads this block into $GITHUB_ENV) and cross-checked
# against the release's SHA256SUMS at fetch time (the same trust-anchor
# role as upstream's per-platform sha256).
tools:
  repo: "tamatebako/tebako"
  release: "v0.3.1"
  sha256:
    tebako:
      macos-arm64: "ea95d642c8bfa03c23a7c4f868c42bb81cbbbbfb87fe28e0e28db0067a850b6e"
      linux-gnu-x86_64: "034804fae6e25f654c64f08889f11ff55e0bdf46dd446d489fb25734b47aadc0"
      windows-ucrt64: "6e86abeb16b3745bdb65e936567bbb255b73b84bcb43fccbf6e93f971cd09984"
    tebako-shim:
      macos-arm64: "eaf022a9e889afc23a70872bf8233904897dd94c9b62a65eb77fbd5c36c20710"
      linux-gnu-x86_64: "3fa00b2e91199514407cb2100fd9c08c787923422cf2c223d74f1c6d97032e1d"
      windows-ucrt64: "1c1a5dd9384b0952286eec1141d3164ae6e34baa2f0e040f787a7d5b0a8ef5a5"
    tfs:
      macos-arm64: "4136cf476a9e7470d401ee66546a841edf154e6a39f6083021b1f8786b6cc755"
      linux-gnu-x86_64: "2dca2fe24401dc7110d7d3297984023e44eb466727ec3cf74459d3d14ea8d623"
      windows-ucrt64: "4fde6e7252a0aef0767fb09c08971396b004f0d25f39f05c774ab8644bd1efe2"

image:
  format: dwarfs
  # .tfs everywhere (the tebako fs image — DwarFS-T format; normal dwarfs
  # readers cannot read it)
  extension:
    default: tfs
